<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 96" role="img"
     aria-label="Class flag H — white on the hoist, red on the fly">
  <title>H — Nefyn's warning signal</title>
  <!-- ICS Hotel: split vertically, white on the HOIST (left, next to the
       pole) and red on the FLY. Nefyn's warning signal, confirmed by the
       club — not a generic stand-in.

       Signal red (Pantone 186), not the club red, because this is matched
       against real bunting rather than the app.

       The hem is not decoration: the white half is drawn on a translucent
       white tile in the sequence strip and on a pale panel elsewhere, and
       without an outline its left edge simply disappears. Same neutral hem
       as the answering pennant, for the same reason. -->
  <rect x="5" y="5" width="67" height="86" fill="#FFFFFF"/>
  <rect x="72" y="5" width="67" height="86" fill="#C8102E"/>
  <rect x="5" y="5" width="134" height="86" fill="none"
        stroke="#3A3A3A" stroke-width="1.6"/>
</svg>
