<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 96" role="img"
     aria-label="Start — the gun has gone">
  <title>Start</title>
  <!-- NOT a racing signal, and deliberately not dressed as one.
       There is no RRS flag meaning "started": at the gun the class flag comes
       DOWN with one sound signal. So this is a symbol rather than bunting —
       signal green with a play mark, which reads as "gone" at a glance and
       cannot be confused with anything an OOD might be asked to fly. -->
  <rect x="5" y="5" width="134" height="86" fill="#007A33"
        stroke="#005A25" stroke-width="1.5"/>
  <path d="M58 27 L96 48 L58 69 Z" fill="#FFFFFF"/>
</svg>
